name: Upstream Drift

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/voidauth/voidauth.git
          git fetch upstream main --no-tags

      - name: Count new upstream commits
        id: drift
        run: |
          COUNT=$(git rev-list --count origin/main..upstream/main)
          echo "count=${COUNT}" >> ${GITHUB_ENV}
          git log --oneline origin/main..upstream/main | head -30 > commits.txt || true

      - name: Close resolved drift issues
        if: env.count == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          OLD=$(gh issue list --state open --search "Upstream drift in:title" --json number --jq '.[0].number' || true)
          if [ -n "${OLD}" ]; then
            gh issue close "${OLD}" --comment "Resolved — the upstream commits have been merged into this fork."
          else
            echo "no open drift issue"
          fi

      - name: Ensure drift label exists
        if: env.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create upstream-sync --color 0E8A16 --description "Upstream voidauth/main has moved" 2>/dev/null \
            && echo "label created" \
            || echo "label already exists (or cannot be created; issue will be created without it)"

      - name: Open or refresh drift issue
        if: env.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TITLE="Upstream drift: ${COUNT} new commit(s) on voidauth/main"
          OLD=$(gh issue list --state open --search "Upstream drift in:title" --json number --jq '.[0].number' || true)
          if [ -n "${OLD}" ]; then
            gh issue close "${OLD}" --comment "Superseded; count changed."
          fi
          {
            echo "Upstream \`voidauth/main\` is **${COUNT} commit(s) ahead** of our mirror (\`origin/main\`)."
            echo ""
            echo "## New commits"
            echo '```'
            cat commits.txt
            echo '```'
            echo ""
            echo "Run the merge playbook in \`FORK.md\` when ready — smaller, more frequent syncs keep merges easy."
          } > body.md
          if ! gh issue create --title "${TITLE}" --body-file body.md --label "upstream-sync"; then
            echo "labelled create failed; retrying without label"
            gh issue create --title "${TITLE}" --body-file body.md
          fi

      - name: Diagnose token permissions (on failure)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "Token permissions as seen by the API:"
          gh api repos/${GITHUB_REPOSITORY} --jq '.permissions' || true
          echo ""
          echo "If 'issues' is false above despite the workflow declaring issues:write,"
          echo "check Settings → Actions → General → Workflow permissions and set it to"
          echo "'Read and write permissions', then re-run this workflow."
